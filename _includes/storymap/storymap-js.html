<script src="{{ '/assets/lib/storymapjs/js/storymap-min.js' | relative_url }}"></script>
{% if page.storymap contains '.csv' %}<script src="{{ '/assets/lib/papaparse.min.js' | relative_url }}"></script>{% endif %}
<script>
// function to create storymap
function initStoryMap(storymap_data) {
    var storymap_options = {};
    // install the localizer before the map is built, so it works even
    // if the library throws while loading (e.g. blocked tile requests)
    localizeStoryMapUI();
    var storymap = new KLStoryMap.StoryMap('storymap', storymap_data, storymap_options);
    window.onresize = function(event) {
        storymap.updateDisplay(); // this isn't automatic
    }
}

// Persian translations for the UI strings hardcoded inside storymap-min.js
// (the library has no built-in "fa" language file); ordered longest-first
// so e.g. "Map Overview" is matched before "Overview"
var STORYMAP_FA_STRINGS = [
    ['From Wikipedia, the free encyclopedia', 'برگرفته از ویکی‌پدیا، دانشنامه آزاد'],
    ['and contributors, under an', 'و مشارکت‌کنندگان، تحت'],
    ['Swipe to Navigate', 'برای جابه‌جایی، صفحه را بکشید'],
    ['Back To Beginning', 'بازگشت به آغاز'],
    ['Map Overview', 'نمای کلی نقشه'],
    ['OpenStreetMap', 'اوپن‌استریت‌مپ'],
    ['open license', 'مجوز آزاد'],
    ['Hide Map', 'پنهان کردن نقشه'],
    ['Show Map', 'نمایش نقشه'],
    ['Overview', 'نمای کلی'],
    ['Loading', 'در حال بارگذاری'],
    ['Leaflet', 'لیفلت'],
    ['OK', 'باشه']
];

// replace the Knight Lab attribution link (set by
// map.attributionControl.setPrefix inside storymap-min.js) with our own
// project name, and translate the library's English UI strings; Leaflet
// rebuilds the attribution HTML on every layer change, so watch the
// container and re-apply whenever English text reappears
function localizeStoryMapUI() {
    var container = document.getElementById('storymap');
    if (!container) return;
    function translateTextNodes(root) {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        var node;
        while ((node = walker.nextNode())) {
            var text = node.nodeValue;
            if (!/[A-Za-z]/.test(text)) continue;
            STORYMAP_FA_STRINGS.forEach(function(pair) {
                if (text.indexOf(pair[0]) !== -1) {
                    text = text.split(pair[0]).join(pair[1]);
                }
            });
            if (text !== node.nodeValue) node.nodeValue = text;
        }
    }
    function localize() {
        var brand = container.querySelector('.vco-knightlab-brand');
        if (brand) {
            var own = document.createElement('a');
            own.className = 'maku-brand';
            own.href = '{{ "/" | relative_url }}';
            own.textContent = 'راهنمای گردشگری ماکو';
            brand.replaceWith(own);
        }
        translateTextNodes(container);
    }
    new MutationObserver(localize).observe(container, { childList: true, subtree: true });
    localize();
}
// add storymap data source
{% if page.storymap contains '.json' %}
// storymap data from JSON file
var storymap_data = "{% if page.storymap contains '/' %}{{ page.storymap | relative_url }}{% else %}{{ '/storymaps/' | append: page.storymap | relative_url }}{% endif %}";
initStoryMap(storymap_data);
{% elsif page.storymap contains '.csv' %}
// storymap data from CSV
// function to process csv into storymap format
function csvStoryMap(results) {
    var csv_slides = results.data;
    // set up object
    var storymap_data = {
        "storymap": {
            "language": "en",
            // satellite imagery (Esri World Imagery) instead of the default OSM street map
            "map_type": "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            "map_subdomains": "abc",
            "attribution": "تصاویر ماهواره‌ای © <a href='https://www.esri.com' target='_blank'>ازری</a>",
            "map_as_image": false,
            "zoomify": false,
            "call_to_action": true,
            "call_to_action_text": "شروع گشت‌وگذار",
            "slides": [ ]
        }
    };
    // reshape slides data
    csv_slides.forEach((slide, index) => {
        //console.log(`title value: ${slide.text_headline} | Food Name:`, slide.lat);
        if(slide.type == "overview") {
            // handle overview slide
            slide = {
                "type": "overview",
                "text": { 
                    "headline": slide.text_headline, 
                    "text": slide.text_description 
                },
                "media": {
                    "caption": slide.media_caption,
                    "credit": slide.media_credit,
                    "url": slide.media_url
                },
                /*
                "background": { 
                    "color": slide.background_color, 
                    "opacity": slide.background_opacity
                },*/
                "date": slide.date
            }
            storymap_data["storymap"]["slides"].push(slide);
            
        } else if(slide.latitude && slide.longitude) {
            // add normal slides
            slide = {
                "location": { 
                    "lat": parseFloat(slide.latitude), 
                    "lon": parseFloat(slide.longitude),
                    "line": true
                },
                "text": { 
                    "headline": slide.text_headline, 
                    "text": slide.text_description 
                },
                "media": {
                    "caption": slide.media_caption,
                    "credit": slide.media_credit,
                    "url": slide.media_url
                },
                /*
                "background": { 
                    "color": slide.background_color, 
                    "opacity": slide.background_opacity
                },*/
                "date": slide.date
            }
            storymap_data["storymap"]["slides"].push(slide);

        } else {
            // error message for bad record to avoid breakage
            console.log("lat / long missing from record in row " + index);
        }
    });
    // send to storymap function
    initStoryMap(storymap_data);
}
// use papaparse to get csv, parse, and send to data function
Papa.parse("{% if page.storymap contains '/' %}{{ page.storymap | relative_url }}{% else %}{{ '/storymaps/' | append: page.storymap | relative_url }}{% endif %}", {
    download: true,
    header: true,
    complete: (results) => csvStoryMap(results)
});
{% else %}
// try to detect error with data filename
document.getElementById('storymap').innerHTML = "در پیکربندی داده‌های نقشه داستانی این صفحه مشکلی وجود دارد. لطفاً مطمئن شوید نام فایل داده را همراه با پسوند .json یا .csv وارد کرده‌اید.";
{% endif %}
</script>
